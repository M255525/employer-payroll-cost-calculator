<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雇主人事成本試算</title>
<meta name="description" content="請一個人到底要花多少錢？輸入月薪、加班、年終、年資，算出勞保、就保、職災、健保、補充保費、勞退、特休與福利的雇主真實成本（2026 年費率）。">
<meta name="theme-color" content="#0F2C4A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F4; --paper:#FFFFFF; --ink:#13263A; --sub:#566A7D; --line:#CBD6DE;
  --sea:#1E4E79; --deep:#0F2C4A; --ice:#F4FAFF; --ice2:#CFE5F5;
  --warn:#C2412D; --ok:#2F7D55; --gold:#B7862A;
  --mono:'JetBrains Mono','Consolas',monospace;
  --serif:'Noto Serif TC','PMingLiU',serif;
  --mq:0px; color-scheme:light;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-fsize="xl"]{font-size:19px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;font-weight:500;line-height:1.6;padding-top:var(--mq)}
body.has-marquee{--mq:34px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea);font-weight:700}
:focus-visible{outline:3px solid #E0A100;outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:var(--deep);z-index:60;overflow:hidden;display:none;align-items:center}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;font-size:15px;font-weight:700;color:#E8F3FB;animation:marquee-scroll 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#app{max-width:72rem;margin:0 auto;padding:.8rem 1rem calc(2rem + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.bar h1{flex:1 1 14rem;font-family:var(--serif);font-size:1.6rem;letter-spacing:.04em;color:var(--deep)}
.bar h1 small{display:block;font-family:'Noto Sans TC',sans-serif;font-size:.8rem;font-weight:500;letter-spacing:0;color:var(--sub)}
.ibtn{min-height:2.6rem;padding:0 .8rem;border:1.5px solid var(--line);border-radius:.55rem;background:var(--paper);font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:.3rem;text-decoration:none;color:var(--ink)}
.ibtn:hover{border-color:var(--sea)}
.warn-line{margin:.45rem 0 0;font-size:.82rem;color:var(--sub)}
.warn-line button{background:none;border:0;padding:0;color:var(--warn);font-weight:700;text-decoration:underline;font-size:inherit}
.exbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.6rem;font-size:.88rem}
.exbar b{color:var(--sub)}
.chipbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:2rem;padding:.25rem .8rem;min-height:2.3rem;font-weight:700}
.chipbtn[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.demo-on{background:var(--deep);color:#fff;border-radius:.6rem;padding:.45rem .8rem;margin-top:.6rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.demo-on span{flex:1 1 14rem}
.demo-on button{background:#fff;color:var(--deep);border:0;border-radius:.45rem;padding:.3rem .9rem;font-weight:900;min-height:2.3rem}

/* 冰山主視覺 */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1rem;margin-top:.9rem}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.berg{background:linear-gradient(#F6FAFC 0,#F6FAFC 100%);border-radius:1rem;border:1.5px solid var(--line);overflow:hidden;position:relative}
.berg svg{display:block;width:100%;height:auto}
.berg-sel{position:absolute;left:.6rem;top:.5rem;display:flex;gap:.3rem;flex-wrap:wrap;max-width:calc(100% - 1.2rem)}
.berg-sel select{border:1.5px solid var(--line);border-radius:.5rem;background:#fff;min-height:2.3rem;padding:0 .4rem;font-weight:700;max-width:16rem}
.berg-leg{display:none;padding:.5rem .8rem .7rem;background:#0F2C4A;color:#EAF4FB;font-size:.85rem;gap:.15rem .8rem;grid-template-columns:1fr auto}
.berg-leg i{display:inline-block;width:.75rem;height:.75rem;border-radius:.2rem;margin-right:.35rem;vertical-align:-1px}
.berg-leg b{font-family:var(--mono);text-align:right}
@media (max-width:600px){.berg-leg{display:grid}.berg svg text{display:none}.bk{grid-template-columns:1fr auto}.bk .barw{display:none}}
.sum{background:var(--deep);color:#fff;border-radius:1rem;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.6rem}
.sum h2{font-size:.95rem;color:#A9C8E2;font-weight:700}
.big{font-family:var(--mono);font-size:2.4rem;font-weight:700;line-height:1.1}
.big small{font-family:'Noto Sans TC',sans-serif;font-size:.9rem;font-weight:500;color:#A9C8E2;margin-left:.3rem}
.ratio{background:rgba(255,255,255,.08);border-radius:.7rem;padding:.55rem .75rem;font-size:.95rem}
.ratio b{font-family:var(--mono);font-size:1.5rem;color:#FFD27A}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.kp div{background:rgba(255,255,255,.07);border-radius:.6rem;padding:.4rem .6rem}
.kp span{display:block;font-size:.75rem;color:#A9C8E2}
.kp b{font-family:var(--mono);font-size:1.1rem}
.sum .note{font-size:.78rem;color:#A9C8E2;margin:0}

/* 分頁 */
.tabs{display:flex;gap:.25rem;margin-top:1.2rem;border-bottom:2.5px solid var(--deep);flex-wrap:wrap}
.tabs button{border:0;border-radius:.6rem .6rem 0 0;background:#DCE5EB;color:var(--sub);font-weight:700;padding:.45rem 1rem;min-height:2.7rem}
.tabs button[aria-selected="true"]{background:var(--deep);color:#fff}
.panel{margin-top:.8rem}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:.9rem;padding:.9rem 1rem;margin-top:.8rem}
.card h3{font-family:var(--serif);font-size:1.15rem;color:var(--deep);margin-bottom:.3rem}
.small{font-size:.84rem;color:var(--sub)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(11.5rem,100%),1fr));gap:.6rem .8rem}
.fld{display:block;font-weight:700;font-size:.88rem}
.fld small{font-weight:500;color:var(--sub)}
.fld input,.fld select{display:block;width:100%;min-height:2.6rem;margin-top:.15rem;border:1.5px solid var(--line);border-radius:.5rem;padding:.2rem .55rem;background:#fff;font-weight:500}
.fld input[type=number]{font-family:var(--mono);text-align:right}
.chk{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem;min-height:2.6rem}
.chk input{width:1.2rem;height:1.2rem;accent-color:var(--sea)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:.55rem;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:.3rem .8rem;min-height:2.4rem;font-weight:700;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--sea);color:#fff}

/* 員工清單 */
.emps{display:grid;gap:.5rem;margin-top:.6rem}
.emp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.3rem .7rem;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:.8rem;padding:.55rem .75rem;cursor:pointer;text-align:left;width:100%}
.emp[aria-current="true"]{border-color:var(--sea);box-shadow:0 0 0 2px var(--sea)}
.emp .av{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--ice2);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--deep)}
.emp b{display:block}
.emp .meta{font-size:.8rem;color:var(--sub)}
.emp .cost{text-align:right;font-family:var(--mono);font-weight:700}
.emp .cost small{display:block;font-family:'Noto Sans TC',sans-serif;font-size:.72rem;color:var(--sub);font-weight:500}
.emp .wn{color:var(--warn);font-weight:900}
.ed>div,.row>*{min-width:0}
.fld select{max-width:100%;text-overflow:ellipsis}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8rem}
@media (max-width:820px){.ed{grid-template-columns:1fr}}
.grp{border-top:1.5px dashed var(--line);padding-top:.6rem;margin-top:.7rem}
.grp>b{display:block;color:var(--sea);margin-bottom:.35rem}
.alert{background:#FCEBE7;border-left:4px solid var(--warn);border-radius:.4rem;padding:.4rem .7rem;margin-top:.6rem;font-size:.88rem}
.alert li{margin:.1rem 0}
.info{background:var(--ice);border-left:4px solid var(--sea);border-radius:.4rem;padding:.4rem .7rem;margin-top:.6rem;font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;min-height:2.7rem;border:0;border-radius:.6rem;background:var(--sea);color:#fff;font-weight:900;padding:.2rem 1.1rem;text-decoration:none}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--warn)}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}

/* 表格 */
.tw{overflow-x:auto;margin-top:.5rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.38rem .5rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#E6EEF3;color:var(--deep);font-weight:900;position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
td.num,th.num{font-family:var(--mono)}
tr.tot td{font-weight:900;border-top:2px solid var(--deep);background:var(--ice)}
.bk{display:grid;grid-template-columns:minmax(8rem,auto) 1fr auto;gap:.25rem .6rem;align-items:center;font-size:.9rem}
.bk .sw{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.35rem;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.bk .barw{height:.7rem;background:#E6EEF3;border-radius:1rem;overflow:hidden}
.bk .barw i{display:block;height:100%;border-radius:1rem}
.bk .v{font-family:var(--mono);text-align:right}
.stack{display:flex;height:2.2rem;border-radius:.5rem;overflow:hidden;border:1px solid var(--line);margin-top:.3rem}
.stack i{display:block;height:100%}
.hl{font-family:var(--mono);font-weight:700;color:var(--sea);font-size:1.25rem}

/* 彈窗、設定 */
#modal{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
#modalBox{background:var(--bg);width:100%;max-width:36rem;max-height:calc(100dvh - 2rem);overflow:auto;border-radius:1rem;padding:1rem 1.1rem}
#modalBox h2{font-family:var(--serif);font-size:1.3rem;color:var(--deep);margin-bottom:.4rem}
#modalBox ul{padding-left:1.2em;margin:.3rem 0}
#modalBox li{margin:.2rem 0}
.set-sec{background:#fff;border:1.5px solid var(--line);border-radius:.6rem;margin-bottom:.45rem}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;gap:.5rem;align-items:center;padding:.55rem .75rem;font-weight:700;min-height:2.9rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';transition:transform .2s}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0}
.set-sec .ssv{font-weight:500;font-size:.78rem;color:var(--sub);text-align:right}
.set-body{padding:0 .75rem .75rem}
.vstack{display:grid;gap:.45rem;margin-top:.5rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.55rem 1rem;border-radius:.7rem;z-index:90;font-weight:700;max-width:calc(100vw - 2rem)}
.foot{text-align:center;font-size:.82rem;color:var(--sub);margin-top:2rem}
.foot a{margin:0 .4rem}
.print-head,#pdfWatermark{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}#marqueeTrack{animation-duration:90s!important}}
@media print{
  @page{size:A4;margin:12mm}
  html{font-size:11px}
  body{background:#fff;padding:0}
  #marqueeBar,.noprint,.tabs,.toast,#modal,.foot,.bar,.warn-line,.exbar,.demo-on,.berg-sel{display:none!important}
  #app{max-width:none;padding:0}
  .print-head{display:block;margin-bottom:.5rem}
  .print-head h1{font-family:var(--serif);font-size:1.6rem;color:var(--deep)}
  .hero{grid-template-columns:1.2fr 1fr}
  .sum,.card,.berg{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel[data-print="0"]{display:none}
  th{position:static}
  #pdfWatermark{display:flex!important;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;pointer-events:none}
  #pdfWatermark img{width:42%;min-width:200px;max-width:380px;opacity:.11}
}
</style>
</head>
<body>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<main id="app"></main>
<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"></div></div>
<noscript>這個工具需要開啟 JavaScript 才能使用。</noscript>
<script src="data.js"></script>
<script src="watermark.js"></script>
<script src="app.js"></script>
</body>
</html>
